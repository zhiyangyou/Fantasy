syntax = "proto3";
package Fantasy.Network.Message;
// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。
// Bson:仅支持在Inner文件里使用。
// 使用方式:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如:// Protocol ProtoBuf 或 // Protocol MemoryPack


message Send_RegisterAccount // IRequest ,Rcv_RegisterAccount
{
  string user_name = 1 ;
  string pass_word = 2 ;
}

message Rcv_RegisterAccount // IResponse
{
  string user_name = 1;
  string pass_word = 2;
}



message Send_GetLoginToken // IRequest ,Rcv_GetLoginToken
{
  string account_name = 1; // 账号
  string pass_word = 2; // 密码
}

message Rcv_GetLoginToken // IResponse
{
  string token = 1; // 登陆令牌
  string login_address = 2; // 登录地址
  int64 account_id = 3; // 账号id
}

message Send_LoginGate // IRequest ,Rcv_LoginGate
{
  string account_name = 1;
  string token = 2;
}

message Rcv_LoginGate // IResponse
{
  int64 account_id = 1; // 账号id
  int64 level = 2;
  int64 gold = 3;
  int64 diamond = 4;

}